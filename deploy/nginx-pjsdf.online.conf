# คัดลอกไปใช้บน VPS เช่น /etc/nginx/sites-available/pjsdf.online แล้ว ln -s + nginx -t + reload
#
# SPA: https://pjsdf.online → static จาก dist
# API: https://api.pjsdf.online → Express (PM2) ที่ 127.0.0.1:3000
# ตั้ง VITE_API_URL=https://api.pjsdf.online ตอน build frontend
#
# DNS: A record api → IP VPS; ถ้าใช้ www ใน cert ต้องมี A (หรือ CNAME) ของ www ด้วย — ไม่มีจะ NXDOMAIN ตอน certbot
#
# TLS (ใช้ path เดียวกับ pjsdf.online ในบล็อก api ด้านล่างจนกว่าจะออก cert แยก):
#   ถ้ายังไม่มี DNS ของ www — อย่าใส่ -d www... ใน certbot:
#   sudo certbot certonly --nginx --cert-name pjsdf.online -d pjsdf.online -d api.pjsdf.online
#   ถ้ามี www ชี้มาที่ VPS แล้ว — ขยายครบ:
#   sudo certbot certonly --nginx --cert-name pjsdf.online -d pjsdf.online -d www.pjsdf.online -d api.pjsdf.online
#   ชื่อ cert ดูจาก: sudo certbot certificates

# --- ทางเลือก: proxy ไป PM2 preview ---
# upstream pjsdf_backend {
#     server 127.0.0.1:4173;
# }

# ---------- API (subdomain) ----------
# ฟัง 443 ทุก server block ต้องใช้บรรทัด listen ชุดเดียวกัน — อย่าใส่ ipv6only=on ซ้ำหลายบล็อก (nginx: duplicate listen options)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.pjsdf.online;

    # ใช้ไฟล์เดียวกับโดเมนหลักจนกว่าจะมี live/api.pjsdf.online (ต้องขยาย SAN ให้รวม api — ดูคอมเมนต์ด้านบนไฟล์)
    ssl_certificate /etc/letsencrypt/live/pjsdf.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pjsdf.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.pjsdf.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- เว็บหลัก (SPA) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name pjsdf.online www.pjsdf.online;

    ssl_certificate /etc/letsencrypt/live/pjsdf.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pjsdf.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    root /var/www/gunyaluck-dev-notes/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- แทนที่ location / ด้วยแบบนี้ถ้าใช้ PM2 preview แทน static ---
    # location / {
    #     proxy_pass http://pjsdf_backend;
    #     ...
    # }
}

server {
    listen 80;
    listen [::]:80;
    server_name pjsdf.online www.pjsdf.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
