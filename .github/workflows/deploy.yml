name: Deploy to Ubuntu (PM2)

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ใส่เนื้อหาไฟล์ .env ทั้งไฟล์ใน GitHub secret ชื่อ APP_ENV (บรรทัดเดียวกับหลายบรรทัดได้)
      - name: Write .env from APP_ENV secret
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ENV}" ]; then
            echo "::error::ตั้งค่า secret APP_ENV ให้เป็นเนื้อหาเดียวกับไฟล์ .env ทั้งฉบับ"
            exit 1
          fi
          echo "$APP_ENV" > .env

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Rsync files to server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${SSH_PORT}" ]; then
            ssh-keyscan -p "${SSH_PORT}" -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
            SSH_OPTS="-p ${SSH_PORT} -o StrictHostKeyChecking=yes"
          else
            ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
            SSH_OPTS="-o StrictHostKeyChecking=yes"
          fi
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude 'node_modules/' \
            --exclude '.github/' \
            -e "ssh ${SSH_OPTS}" \
            ./ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Install deps and reload PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
